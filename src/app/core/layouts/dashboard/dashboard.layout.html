<div
  class="bg-card-background w-full h-screen flex flex-col overflow-hidden scrollbar-veeti min-h-screen"
>
  <div class="flex h-full max-w-screen-2xl mx-auto w-full">
    <!-- Mobile Overlay -->
    @if (isSidebarOpen()) {
      <div
        class="fixed inset-0 bg-background/80 backdrop-blur-sm z-40 lg:hidden"
        (click)="closeSidebar()"
        aria-hidden="true"
      ></div>
    }

    <!-- Sidebar -->
    <app-layout-sidebar
      [isOpen]="isSidebarOpen()"
      [isCollapsed]="effectiveIsCollapsed()"
      [menu]="menu"
      (closeSidebar)="closeSidebar()"
      (toggleSidebar)="toggleSidebar()"
    >
      <!-- Header Slot -->
      <div
        sidebar-header
        class="flex items-center justify-between gap-3 w-full"
        [class.flex-col]="effectiveIsCollapsed()"
      >
        <div class="flex items-center gap-3">
          <div
            class="p-2 rounded-lg bg-primary flex items-center justify-center text-white shrink-0"
          >
            <v-icon name="dashboard" size="lg"></v-icon>
          </div>
          @if (!effectiveIsCollapsed()) {
            <div class="flex flex-col overflow-hidden space-y-1">
              <h1 class="text-foreground text-lg font-bold leading-none tracking-tight truncate">
                Veeti
              </h1>
              <p
                class="text-muted-foreground text-xs font-normal leading-none tracking-tight truncate"
              >
                Plataforma Veterinária
              </p>
            </div>
          }
        </div>
        <app-button
          variant="outline"
          size="sm"
          (click)="toggleCollapse(); closeSidebar()"
          [title]="isSidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        >
          <v-icon
            [name]="isSidebarCollapsed() ? 'keyboard_arrow_right' : 'keyboard_arrow_left'"
            size="md"
          ></v-icon>
        </app-button>
      </div>
    </app-layout-sidebar>

    <!-- Content Area -->
    <div class="flex-1 min-w-0 flex flex-col h-full bg-background transition-all duration-300">
      <app-layout-header
        (toggleTheme)="toggleTheme()"
        (triggerNotification)="notification()"
      ></app-layout-header>

      <app-layout-content>
        <router-outlet></router-outlet>
      </app-layout-content>
    </div>
  </div>
</div>
