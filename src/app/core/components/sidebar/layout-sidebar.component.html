<aside
  class="fixed inset-y-0 left-0 z-50 w-65 shrink-0 bg-card-background border-r border-border transform transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:h-full lg:flex lg:flex-col overflow-y-auto pb-4 px-2"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
>
  <div class="flex items-center gap-3 py-4">
    <div class="py-2 px-2 rounded-lg bg-primary flex items-center justify-center text-white">
      <v-icon name="dashboard" size="lg"></v-icon>
    </div>
    <div class="flex flex-col">
      <h1 class="text-foreground text-lg font-bold leading-none tracking-tight">Veeti</h1>
      <span class="text-xs text-muted-foreground mt-1">Dashboard</span>
    </div>
  </div>

  <nav class="flex flex-col gap-2 text-foreground mt-8">
    <ul>
      @for (item of menu().pages; track $index) {
        <li>
          <a
            [routerLink]="item.path"
            class="flex justify-start items-center gap-1 rounded-lg px-3 py-2 hover:bg-muted hover:text-muted-foreground text-sm font-medium"
          >
            <v-icon name="{{ item.icon }}" size="md"></v-icon>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
