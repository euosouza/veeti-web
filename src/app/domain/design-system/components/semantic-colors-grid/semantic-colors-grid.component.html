<div class="w-full space-y-2 rounded-xl p-5" [class]="containerClass()">
  <div class="flex items-center gap-2">
    <span class="material-symbols-outlined" [class]="iconClass()">{{ icon() }}</span>
    <h4 class="font-bold" [class]="titleClass()">
      {{ title() }}
    </h4>
  </div>
  <p class="text-xs" [class]="descriptionClass()">
    {{ description() }}
  </p>

  <div
    class="grid grid-cols-2 gap-6 pt-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-10"
  >
    @for (cor of colors(); track $index) {
      <div
        (click)="onClickCopy(cor.var)"
        (keydown.enter)="onClickCopy(cor.var)"
        tabindex="0"
        role="button"
        class="group flex cursor-pointer flex-col gap-3"
      >
        <div
          class="relative aspect-square w-full overflow-hidden rounded-xl border border-black/5 shadow-sm transition-all hover:shadow-md dark:border-white/5"
          [style.background-color]="'var(' + cor.var + ')'"
        >
          <div
            class="absolute inset-0 flex items-center justify-center bg-black/5 opacity-0 backdrop-blur-[2px] transition-opacity group-hover:opacity-100"
          >
            <span class="material-symbols-outlined text-black">content_copy</span>
          </div>
        </div>
        <div class="flex flex-col px-1">
          <span class="text-sm font-semibold text-foreground">{{ cor.name }}</span>
          <span class="font-mono text-xs uppercase text-muted-foreground">{{ cor.oklch }}</span>
        </div>
      </div>
    }
  </div>
</div>
